name: Agri-Aqua Network CI/CD Pipeline

on:
  push:
    branches: [ main, development, feature/* ]
  pull_request:
    branches: [ main, development ]

jobs:
  validate-and-test:
    name: Code Quality, Security & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Strict TypeScript Compilation
        run: npm run type-check

      - name: ESLint Static Code Analysis
        run: npx eslint src

      - name: Execute Vitest Test Suite (145+ Tests)
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build

  deploy-staging:
    name: Deploy to Staging Environment
    needs: validate-and-test
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Log Staging Trigger
        run: echo "Triggering automated staging deployment to staging.agriaqua.net..."

  deploy-production:
    name: Deploy to Production Cluster (Manual Approval Gate)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://agriaqua.net
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Log Production Deployment
        run: echo "Deploying approved release to production cluster with zero-downtime rolling update..."
